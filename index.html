<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>퇴근 내놔</title>
    <style>
        /* 기본 디자인 */
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f4f4f4; }
        nav { background: #333; color: #fff; padding: 1rem; text-align: center; position: sticky; top: 0; z-index: 1000; }
        
        /* 버튼 스타일 */
        .nav-btn { color: #fff; margin: 0 15px; text-decoration: none; background: none; border: none; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .nav-btn:hover { color: #ffeb3b; }
        .nav-btn.active-tab { color: #ffeb3b; font-weight: bold; border-bottom: 2px solid #ffeb3b; }

        /* 섹션 기본값: 모두 숨김 처리 */
        section { 
            display: none; 
            padding: 40px; 
            max-width: 800px; 
            margin: 50px auto; 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }

        /* 현재 활성화된 섹션만 보이게 함 */
        section.active { display: block; animation: fadeIn 0.5s; }

        /* 프로필 영역 디자인 */
        .profile-area { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        /* 사진이 없어도 영역을 차지하도록 background 설정 */
        .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; background: #eee; border: 1px solid #ddd; } 
        .my-laugh-btn { font-family: "Gungsuh", "궁서", serif; font-size: 24px; font-weight: bold; color: #d32f2f; }

        /* 갤러리 디자인 */
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .gallery img { width: 45%; border-radius: 5px; border: 1px solid #ddd; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav>
        <button id="btn-home" class="nav-btn active-tab" onclick="showSection('home')">홈</button>
        <button id="btn-profile" class="nav-btn" onclick="showSection('profile')">프로필</button>
        <button id="btn-gallery" class="nav-btn" onclick="showSection('gallery')">갤러리</button>
    </nav>

    <section id="home" class="active">
        <h1>아룡하세요</h1>
        <p>GitHub로 처음 만들어봤다네요.<br>
           좋은 말로 할 때 퇴근을 내놓으세요        
        </p>
    </section>

    <section id="profile">
        <h2>소개 (Profile)</h2>
        <div class="profile-area">
            <img src="my-photo.jpg" alt="웃음버튼" class="profile-img">
            <span class="my-laugh-btn">내 웃음버튼</span>
        </div>
        <p>
            <b>이름: 조혜원.</b> 할 일이 없어 심심한 노비임<br><br>
            <b>대충 이력:</b><br>
            - 교육학 석사임<br>
            - 핑까 전공<br>
            - 어쩌다 미친사회혁신센타에 있음
        </p>
    </section>

 <section id="gallery">
        <h2>갤러리 (Gallery)</h2>
        <div class="gallery">
            
            <div class="gallery-item">
                <img src="pic1.jpg" alt="사진1">
                <p class="caption">둉노우 중독</p>
            </div>

            <div class="gallery-item">
                <img src="pic2.jpg" alt="사진2">
                <p class="caption hashtag">#mood #퇴근내놔 #주4일제실시하라</p>
            </div>

        </div>
    </section>

    <style>
        .gallery { 
            display: flex; 
            justify-content: space-around; 
            align-items: flex-start; 
            flex-wrap: wrap; 
            gap: 20px; 
        }

        .gallery-item { 
            width: 45%; 
            text-align: center; 
        }

        .gallery-item img { 
            width: 100%; 
            border-radius: 10px; 
            border: 1px solid #ddd;
            background: #eee; /* 사진 로딩 전 보일 배경색 */
        }

        .caption {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        /* 오른쪽 해시태그 스타일 */
        .hashtag {
            color: #007bff; 
            font-size: 14px;
            word-break: keep-all;
            line-height: 1.4;
        }
    </style>

    <script>
        function showSection(sectionId) {
            // 1. 모든 섹션 숨기기
            const sections = document.querySelectorAll('section');
            sections.forEach(sec => sec.classList.remove('active'));

            // 2. 모든 버튼에서 활성화 효과 제거
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active-tab'));

            // 3. 선택한 섹션 보여주기
            const target = document.getElementById(sectionId);
            if (target) {
                target.classList.add('active');
            }

            // 4. 클릭한 버튼에 활성화 효과 추가
            event.currentTarget.classList.add('active-tab');

            // 5. 클릭 시 화면 최상단으로 이동
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
