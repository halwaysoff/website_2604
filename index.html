<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>묵시 메롱</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 0; }
        nav { background: #333; color: #fff; padding: 1rem; text-align: center; }
        nav a { color: #fff; margin: 0 15px; text-decoration: none; }
        section { padding: 20px; max-width: 800px; margin: auto; }
        .profile-img { width: 200px; border-radius: 50%; } /* 프로필 사진 동그랗게 */
        .gallery img { width: 30%; margin: 1%; border: 1px solid #ddd; } /* 갤러리 정렬 */
    </style>
</head>
<body>

<nav>
    <a href="#home">홈</a>
    <a href="#profile">프로필</a>
    <a href="#gallery">갤러리</a>
</nav>

<section id="home">
     <h1>아룡하세요</h1>
        <p>GitHub로 처음 만들어봤다네요</p>
    </section>
    
<section id="profile">
    <h2>소개 (Profile)</h2>
    <div class="profile-area">
        <img src="my-photo" alt="내 웃음버튼" class="profile-img">
        <span class="my-laugh-btn">내 웃음버튼</span>
    </div>
    할 일이 없어 심심한 노비임<br>
    대충 이력: <br>
    교육학 석사임 <br>
    핑까 전공 <br>
    어쩌다 미친사회혁신센타에 있음
       </p>
</section>

<section id="gallery">
    <h2>갤러리 (Gallery)</h2>
        <div class="gallery">
            <img src="pic1" alt="둉노우중독">
            <img src="pic2" alt="#mood">
        </div>
</section>

</body>
</html>
